name: AI Clean Python Cache

on:
  push:
    branches:
      - feature/scrapers-sync
    paths:
      - .github/workflows/ai-clean-python-cache.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scrapers-sync
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove tracked Python cache artifacts
        shell: bash
        run: |
          git ls-files '.local/scrapers/stash-a/**/__pycache__/*' -z | xargs -0 -r git rm -f
          git ls-files 'scripts/dev/**/__pycache__/*' -z | xargs -0 -r git rm -f

          python - <<'PY'
          from pathlib import Path

          gitignore = Path('.gitignore')
          text = gitignore.read_text(encoding='utf-8')
          block = '''
# Python bytecode/cache artifacts
__pycache__/
*.py[cod]
*$py.class
'''
          if '# Python bytecode/cache artifacts' not in text:
              text = text.rstrip() + '\n' + block
              gitignore.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ai-clean-python-cache.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore .github/workflows/ai-clean-python-cache.yml
          git diff --cached --check
          git commit -m "Remove tracked Python cache artifacts" || exit 0
          git push origin HEAD:feature/scrapers-sync
