enum SourceType {
  SITE
  SITE_SECTION
  SEARCH
  CATEGORY
  ACCOUNT
  CHANNEL
  PROFILE
  COLLECTION
  OTHER
}

enum SourceCandidateStatus {
  NEW
  LINKED
  PROMOTED
  IGNORED
  STALE
  ERROR
}

enum SourceIgnoredContentType {
  SCENE
  IMAGE
  GALLERY
  GROUP
  SOURCE
}

type Source {
  id: ID!
  title: String!
  urls: [String!]!
  details: String
  type: SourceType!
  parent: Source
  parent_id: ID
  children: [Source!]!
  thumbnail_url: String
  rating100: Int
  favorite: Boolean!
  last_synced_at: Time
  created_at: Time!
  updated_at: Time!
  candidate_scene_count: Int!
  ignored_count: Int!
}

input SourceCreateInput {
  title: String!
  urls: [String!]
  details: String
  type: SourceType = OTHER
  parent_id: ID
  thumbnail_url: String
  rating100: Int
  favorite: Boolean
}

input SourceUpdateInput {
  id: ID!
  title: String
  urls: [String!]
  details: String
  type: SourceType
  parent_id: ID
  thumbnail_url: String
  rating100: Int
  favorite: Boolean
}

input SourceDestroyInput {
  id: ID!
}

input SourceSyncByURLInput {
  source_id: ID
  url: String!
}

type SourceSyncResult {
  source: Source!
  candidate_scenes: [SourceCandidateScene!]!
  candidate_scene_count: Int!
  created_source: Boolean!
}

type FindSourcesResultType {
  count: Int!
  sources: [Source!]!
}

type SourceCandidateRelation {
  id: ID
  name: String!
  position: Int!
}

type SourceCandidateScene {
  id: ID!
  source_id: ID!
  external_id: String
  url: String!
  title: String
  date: String
  details: String
  thumbnail_url: String
  duration_seconds: Int
  position: Int!
  status: SourceCandidateStatus!
  target_scene_id: ID
  target_scene: Scene
  source_slug: String
  raw_scraped_json: String
  raw_online_media_json: String
  user_modified: Boolean!
  last_seen_at: Time
  last_scraped_at: Time
  created_at: Time!
  updated_at: Time!
  tags: [SourceCandidateRelation!]!
  performers: [SourceCandidateRelation!]!
  groups: [SourceCandidateRelation!]!
  galleries: [SourceCandidateRelation!]!
}

input SourceCandidateRelationInput {
  id: ID
  name: String!
  position: Int = 0
}

input SourceCandidateSceneInput {
  source_id: ID!
  external_id: String
  url: String!
  title: String
  date: String
  details: String
  thumbnail_url: String
  duration_seconds: Int
  position: Int = 0
  status: SourceCandidateStatus = NEW
  target_scene_id: ID
  source_slug: String
  raw_scraped_json: String
  raw_online_media_json: String
  tags: [SourceCandidateRelationInput!]
  performers: [SourceCandidateRelationInput!]
  groups: [SourceCandidateRelationInput!]
  galleries: [SourceCandidateRelationInput!]
}

type SourceIgnoredItem {
  id: ID!
  source_id: ID!
  content_type: SourceIgnoredContentType!
  external_id: String
  url: String!
  title: String
  thumbnail_url: String
  reason: String
  ignored_at: Time!
  created_at: Time!
  updated_at: Time!
}

input SourceIgnoreItemInput {
  source_id: ID!
  content_type: SourceIgnoredContentType!
  external_id: String
  url: String!
  title: String
  thumbnail_url: String
  reason: String
}

input SourceUnignoreItemInput {
  source_id: ID!
  content_type: SourceIgnoredContentType!
  url: String!
}

extend type Query {
  findSource(id: ID!): Source
  findSourceByURL(url: String!): Source
  findSources: FindSourcesResultType!
  findSourceCandidateScenes(source_id: ID!): [SourceCandidateScene!]!
  findSourceIgnoredItems(source_id: ID!): [SourceIgnoredItem!]!
}

extend type Mutation {
  sourceCreate(input: SourceCreateInput!): Source
  sourceUpdate(input: SourceUpdateInput!): Source
  sourceDestroy(input: SourceDestroyInput!): Boolean!
  sourceSyncByURL(input: SourceSyncByURLInput!): SourceSyncResult!
  sourceCandidateSceneSave(input: SourceCandidateSceneInput!): SourceCandidateScene
  sourceIgnoreItem(input: SourceIgnoreItemInput!): SourceIgnoredItem
  sourceUnignoreItem(input: SourceUnignoreItemInput!): Boolean!
}

extend type Scene {
  sources: [Source!]!
}
