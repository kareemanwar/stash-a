type SceneOnlineMedia {
  id: ID!
  scene_id: ID!
  source_name: String!
  source_slug: String!
  external_id: String
  page_url: String!
  canonical_url: String
  embed_url: String
  direct_video_url: String
  thumbnail_url: String
  duration_seconds: Int
  external_view_count: Int
  raw_metadata_json: String
  last_scraped_at: Time
  created_at: Time!
  updated_at: Time!
  streams: [SceneOnlineStream!]!
}

type SceneOnlineStream {
  id: ID!
  scene_online_media_id: ID!
  label: String
  kind: String!
  url: String!
  position: Int!
  is_primary: Boolean!
  created_at: Time!
  updated_at: Time!
}

input SceneOnlineMediaInput {
  scene_id: ID!
  source_name: String!
  source_slug: String!
  external_id: String
  page_url: String!
  canonical_url: String
  embed_url: String
  direct_video_url: String
  thumbnail_url: String
  duration_seconds: Int
  external_view_count: Int
  raw_metadata_json: String
  streams: [SceneOnlineStreamInput!]
}

input SceneOnlineStreamInput {
  label: String
  kind: String!
  url: String!
  position: Int!
  is_primary: Boolean!
}

extend type Scene {
  online_media: SceneOnlineMedia
  embed_url: String
  direct_video_url: String
  duration_seconds: Int
  external_view_count: Int
}

extend type Mutation {
  sceneOnlineMediaSave(input: SceneOnlineMediaInput!): SceneOnlineMedia
  sceneOnlineMediaDestroy(id: ID!): Boolean!
}
