name: AI Apply Typecheck Fix

on:
  push:
    branches:
      - feature/scrapers-sync
    paths:
      - .github/workflows/ai-apply-typecheck-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scrapers-sync
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply UI typecheck fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          online = Path('ui/v2.5/src/components/Scenes/SceneDetails/OnlineScenePlayerPatch.tsx')
          text = online.read_text(encoding='utf-8')
          text = text.replace(
              '''import {
            ApolloClient,
            NormalizedCacheObject,
            gql,
            useApolloClient,
            useQuery,
          } from "@apollo/client";''',
              '''import {
            ApolloClient,
            gql,
            useApolloClient,
            useQuery,
          } from "@apollo/client";'''
          )
          text = text.replace(
              'client: ApolloClient<NormalizedCacheObject>,',
              'client: ApolloClient<object>,'
          )
          online.write_text(text, encoding='utf-8')

          scraper = Path('ui/v2.5/src/components/ScraperTest/ScraperTest.tsx')
          text = scraper.read_text(encoding='utf-8')
          text = text.replace(
              '} as GQL.TagDataFragment)',
              '} as unknown as GQL.TagDataFragment)'
          )
          scraper.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ai-apply-typecheck-fix.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/v2.5/src/components/Scenes/SceneDetails/OnlineScenePlayerPatch.tsx ui/v2.5/src/components/ScraperTest/ScraperTest.tsx .github/workflows/ai-apply-typecheck-fix.yml
          git diff --cached --check
          git commit -m "Fix UI type check for online playback refresh" || exit 0
          git push origin HEAD:feature/scrapers-sync
